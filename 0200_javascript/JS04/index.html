<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js04</title>
    <style>
        body {
            font-size: 3rem;
            font-family: Helvetica;
        }
    </style>
</head>
<body>
    <script type="text/javascript" language="javascript">

        // Declaració de variables
        var verd="verd";
        var vermell="vermell";
        var blau="blau";

        // Prompt per demanar informació/entrada de dades
        var color=prompt("escriu el nom del color");

        // Ccomparem les dades unes amb altres

        if (color==verd){
            document.write("Passa");
            document.body.style.backgroundColor="#3cb371";
            document.body.style.color="#FFF";
        }

        else if (color==vermell) {
            document.write("Stop");
            document.body.style.backgroundColor="#ff6347";
            document.body.style.color="#FFF";
        }

         else if (color==blau) {
            document.write("Extra");
            document.body.style.backgroundColor="blue";
            document.body.style.color="#FFF";
        }

        else {
            document.write("Alerta");
             document.body.style.backgroundColor="#ffa500";
             document.body.style.color="#FFF";
            }

    </script>
</body>
</html>
